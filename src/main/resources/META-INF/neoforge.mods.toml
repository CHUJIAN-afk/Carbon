modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mods]]
modId="carbon"
version="${version}"
displayName="Carbon（碳）"
authors="FirstSight"
logoFile="assets/carbon/icon.png"
description='''Caches standard item model geometry on the GPU and instances matching submissions across display contexts. Preserves caller transforms in the generic pipeline and accelerates dropped-item animation and shadows, with optional visual-only GPU tumbling.'''
displayTest="IGNORE_ALL_VERSION"

[[mixins]]
config="carbon.mixins.json"

[[dependencies.carbon]]
modId="neoforge"
type="required"
versionRange="[21.1.238,21.2)"
side="CLIENT"

[[dependencies.carbon]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
side="CLIENT"

[[dependencies.carbon]]
modId="iris"
type="optional"
versionRange="[1.8,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.carbon]]
modId="item_model_optimization"
type="incompatible"
versionRange="[0,)"
reason="Carbon replaces Item Model Optimization. Remove the older jar when upgrading."
side="CLIENT"
