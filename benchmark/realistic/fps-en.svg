<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1580" viewBox="0 0 840 1580" role="img" aria-labelledby="title description">
<title id="title">Carbon item rendering benchmark</title>
<desc id="description">Average game FPS from ten 20-second foreground recordings at 1920 by 1080 with F3 enabled. Four scenarios compare vanilla NeoForge, Lithium and Sodium, and Carbon. Each panel uses an independent linear scale.</desc>
<rect width="840" height="1580" fill="#ffffff"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#182332}.title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#596979}.meta{font-size:14px;fill:#596979}.heading{font-size:23px;font-weight:700}.caption{font-size:14px;fill:#637182}.name{font-size:16px}.value{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}.relative{font-size:13px;fill:#637182}.foot{font-size:13px;fill:#637182}</style>
<text x="32" y="55" class="title">Carbon · Item Rendering Benchmark</text>
<text x="32" y="85" class="subtitle">Normal entity updates and frozen ticks</text>
<text x="32" y="116" class="meta">Intel Core i7-12800HX · NVIDIA GeForce RTX 4070 Laptop GPU</text>
<text x="32" y="139" class="meta">Minecraft 1.21.1 · NeoForge 21.1.238 · Carbon 1.21.1.7</text>
<text x="32" y="162" class="meta">1920×1080 · F3 enabled · UI scale 3× · 20-second samples · Average FPS</text>
<g aria-label="10000 grounded netherite swords">
<rect x="24" y="200" width="792" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<text x="52" y="236" class="heading">10000 grounded netherite swords</text>
<text x="52" y="259" class="caption">Gravity and collisions enabled · Items settled on the ground</text>
<text x="52" y="292" class="name">Vanilla</text>
<rect x="52" y="303" width="0.2271" height="20" rx="4" fill="#91a0af"/>
<text x="600" y="321" class="value">0.30 FPS</text>
<text x="52" y="344" class="relative">100.00% of vanilla</text>
<text x="52" y="376" class="name">Lithium + Sodium</text>
<rect x="52" y="387" width="7.4940" height="20" rx="4" fill="#418ac6"/>
<text x="600" y="405" class="value">9.90 FPS</text>
<text x="52" y="428" class="relative">3300.00% of vanilla</text>
<text x="52" y="460" class="name">Lithium + Sodium + Carbon</text>
<rect x="52" y="471" width="520.0000" height="20" rx="4" fill="#7255bd"/>
<text x="600" y="489" class="value">686.95 FPS</text>
<text x="52" y="512" class="relative">228983.33% of vanilla</text>
</g>
<g aria-label="4000 continuously falling swords">
<rect x="24" y="560" width="792" height="360" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<text x="52" y="596" class="heading">4000 continuously falling swords</text>
<text x="52" y="619" class="caption">Continuous spawning · 10-block fall · Removal below the fall zone</text>
<text x="52" y="638" class="caption">16 spawn columns · Entity distance 500% in all three groups</text>
<text x="52" y="671" class="name">Vanilla</text>
<rect x="52" y="682" width="8.4701" height="20" rx="4" fill="#91a0af"/>
<text x="600" y="700" class="value">9.30 FPS</text>
<text x="52" y="723" class="relative">100.00% of vanilla</text>
<text x="52" y="755" class="name">Lithium + Sodium</text>
<rect x="52" y="766" width="28.5069" height="20" rx="4" fill="#418ac6"/>
<text x="600" y="784" class="value">31.30 FPS</text>
<text x="52" y="807" class="relative">336.56% of vanilla</text>
<text x="52" y="839" class="name">Lithium + Sodium + Carbon</text>
<rect x="52" y="850" width="520.0000" height="20" rx="4" fill="#7255bd"/>
<text x="600" y="868" class="value">570.95 FPS</text>
<text x="52" y="891" class="relative">6139.25% of vanilla</text>
</g>
<g aria-label="1600 grounded swords · /tick freeze">
<rect x="24" y="940" width="792" height="256" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<text x="52" y="976" class="heading">1600 grounded swords · /tick freeze</text>
<text x="52" y="999" class="caption">Gravity and collisions enabled · Game ticks frozen after landing</text>
<text x="52" y="1032" class="name">Vanilla</text>
<rect x="52" y="1043" width="13.5113" height="20" rx="4" fill="#91a0af"/>
<text x="600" y="1061" class="value">42.15 FPS</text>
<text x="52" y="1084" class="relative">100.00% of vanilla</text>
<text x="52" y="1116" class="name">Carbon</text>
<rect x="52" y="1127" width="520.0000" height="20" rx="4" fill="#7255bd"/>
<text x="600" y="1145" class="value">1622.20 FPS</text>
<text x="52" y="1168" class="relative">3848.64% of vanilla</text>
</g>
<g aria-label="1600 grounded swords · Normal ticks">
<rect x="24" y="1216" width="792" height="256" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<text x="52" y="1252" class="heading">1600 grounded swords · Normal ticks</text>
<text x="52" y="1275" class="caption">Same settled layout and view as the frozen-tick test</text>
<text x="52" y="1308" class="name">Vanilla</text>
<rect x="52" y="1319" width="13.8752" height="20" rx="4" fill="#91a0af"/>
<text x="600" y="1337" class="value">38.90 FPS</text>
<text x="52" y="1360" class="relative">100.00% of vanilla</text>
<text x="52" y="1392" class="name">Carbon</text>
<rect x="52" y="1403" width="520.0000" height="20" rx="4" fill="#7255bd"/>
<text x="600" y="1421" class="value">1457.85 FPS</text>
<text x="52" y="1444" class="relative">3747.69% of vanilla</text>
</g>
<text x="32" y="1512" class="foot">Vanilla = NeoForge without performance mods.</text>
<text x="32" y="1534" class="foot">Each panel uses an independent linear scale. All FPS values were measured while recording.</text>
</svg>
