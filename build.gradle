buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}

plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = 'first.carbon'
base.archivesName = 'carbon'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run-forge')
            mods {
                carbon { source sourceSets.main }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'carbon.refmap.json'
    config 'carbon.mixins.json'
}

repositories { mavenCentral() }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.22'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.3.5'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.3.5'
    implementation 'io.github.llamalad7:mixinextras-forge:0.3.5'
    jarJar('io.github.llamalad7:mixinextras-forge:0.3.5') {
        jarJar.ranged(it, '[0.3.5,)')
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// MixinGradle 的映射副产物未包含在编译缓存中。
tasks.named('compileJava') { outputs.cacheIf { false } }
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand(version: project.version) }
}
tasks.withType(Jar).configureEach { from 'LICENSE' }
tasks.named('jar', Jar) {
    archiveClassifier = 'slim'
    manifest.attributes('MixinConfigs': 'carbon.mixins.json')
    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar) {
    archiveClassifier = ''
    manifest.attributes('MixinConfigs': 'carbon.mixins.json')
    finalizedBy 'reobfJarJar'
}

reobf { jarJar {} }
